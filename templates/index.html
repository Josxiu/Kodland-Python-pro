<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de contraseñas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; text-align: center; padding-top: 60px; }
        .caja { background: white; display: inline-block; padding: 30px 40px; border-radius: 12px; box-shadow: 0 2px 8px #ccc; }
        input, button { font-size: 18px; padding: 8px; margin: 8px; }
        button { background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .resultado { font-family: monospace; font-size: 22px; background: #eef; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="caja">
        <h1>🔐 Generador de contraseñas</h1>
        <form method="POST">
            <label>Longitud:</label>
            <input type="number" name="longitud" min="4" max="50" value="12" required>
            <button type="submit">Generar</button>
        </form>

        {% if contrasena %}
            <p>Tu contraseña es:</p>
            <p class="resultado">{{ contrasena }}</p>
        {% endif %}
    </div>
</body>
</html>
